<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restaurante Pasta La Vista</title>
    <style>
        :root {
            --bg-base: #121212;
            --bg-panel: #1a1a1a;
            --bg-hover: #2a2a2a;
            --border-color: #333333;
            --text-main: #eaeaea;
            --text-muted: #888888;
            --accent-purple: #7b61ff;
            --accent-green: #00c853;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-areas:
                "sidebar header"
                "sidebar main";
            grid-template-columns: 260px 1fr;
            grid-template-rows: 70px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        header {
            grid-area: header;
            background-color: var(--bg-base);
            padding: 0 30px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 500;
            margin: 0;
        }

        nav {
            grid-area: sidebar;
            background-color: var(--bg-base);
            border-right: 1px solid var(--border-color);
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            overflow-y: auto;
        }

        nav a.nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 10px 15px;
            border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        nav a.nav-link:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        /* Contenedor para separar la zona de autenticación */
        .auth-container {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Estilos para el saludo del usuario */
        nav span.user-greeting {
            color: var(--text-main);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
            padding: 5px 0;
        }

        nav form.logout-form {
            display: flex;
            flex-direction: column;
            margin: 0;
        }

        /* Botón de Cerrar Sesión transformado */
        nav button.btn-logout {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid #ff4c4c;
            background-color: transparent;
            color: #ff4c4c;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
            text-align: center;
        }

        nav button.btn-logout:hover {
            background-color: #ff4c4c;
            color: #ffffff;
        }

        /* Botones de Iniciar Sesión y Registrarse */
        .btn-primary {
            background-color: var(--accent-purple);
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background-color 0.2s ease;
            display: block;
        }

        .btn-primary:hover {
            background-color: #6a50e5;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            text-decoration: none;
            text-align: center;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: background-color 0.2s ease, border-color 0.2s ease;
            display: block;
        }

        .btn-secondary:hover {
            background-color: var(--bg-hover);
            border-color: var(--text-muted);
        }

        .contenedor {
            grid-area: main;
            background-color: var(--bg-panel);
            margin: 20px;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        table, th, td {
            border: none;
            border-bottom: 1px solid var(--border-color);
        }

        th, td {
            padding: 15px 10px;
            text-align: left;
        }

        th {
            background-color: transparent;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        td {
            color: var(--text-main);
        }

        .card {
            display: inline-block;
            width: 240px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin: 10px 15px 10px 0;
            text-align: left;
            vertical-align: top;
            transition: border-color 0.2s ease;
        }

        .card:hover {
            border-color: var(--accent-purple);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>
    <header>
        <h1>Sistema de Gestión de Pedidos - Pasta La Vista</h1>
    </header>

    <nav>
        <a href="/" class="nav-link">Inicio</a>
        <a href="/clientes/" class="nav-link">Clientes</a>
        <a href="/empleados/" class="nav-link">Empleados</a>
        <a href="/mesas/" class="nav-link">Mesas</a>
        <a href="/platos/" class="nav-link">Platos</a>
        <a href="/ordenes/" class="nav-link">Órdenes</a>
        <a href="/facturas/" class="nav-link">Facturas</a>
        
        {% if user.is_authenticated %}
            <div class="auth-container">
                <span class="user-greeting">Hola, {{ user.username }}</span>
                <form action="{% url 'logout' %}" method="post" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="btn-logout">Cerrar Sesión</button>
                </form>
            </div>
        {% else %}
            <div class="auth-container">
                <a href="{% url 'login' %}" class="btn-primary">Iniciar Sesión</a>
                <a href="{% url 'register' %}" class="btn-secondary">Registrarse</a>
            </div>
        {% endif %}
        
        <a href="/admin/" class="nav-link" style="margin-top: 15px;">Admin</a>
    </nav>

    <div class="contenedor">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
