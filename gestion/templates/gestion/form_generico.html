{% extends "gestion/base.html" %}

{% block content %}
<style>
    /* Contenedor del formulario */
    .form-box {
        max-width: 600px;
        margin: 20px auto;
        background-color: var(--bg-panel, #1a1a1a);
        padding: 30px 40px;
        border-radius: 16px;
        border: 1px solid var(--border-color, #333333);
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .form-box h2 {
        margin-top: 0;
        margin-bottom: 25px;
        font-size: 1.5rem;
        color: var(--text-main, #eaeaea);
        font-weight: 600;
    }

    /* Modificación de la estructura generada por Django */
    .generic-form p {
        margin-bottom: 18px;
        display: flex;
        flex-direction: column;
    }

    .generic-form label {
        font-size: 0.85rem;
        color: var(--text-muted, #888888);
        margin-bottom: 8px;
        font-weight: 500;
    }

    /* Estilos globales para inputs, textareas y selects */
    .generic-form input[type="text"],
    .generic-form input[type="number"],
    .generic-form input[type="email"],
    .generic-form input[type="password"],
    .generic-form textarea,
    .generic-form select {
        width: 100%;
        padding: 12px 15px;
        background-color: var(--bg-base, #121212);
        border: 1px solid var(--border-color, #333333);
        border-radius: 8px;
        color: var(--text-main, #eaeaea);
        font-family: inherit;
        box-sizing: border-box;
        font-size: 0.95rem;
        transition: border-color 0.2s ease;
    }

    .generic-form textarea {
        resize: vertical; /* Permite cambiar el tamaño solo hacia abajo */
        min-height: 100px;
    }

    .generic-form input:focus,
    .generic-form textarea:focus,
    .generic-form select:focus {
        outline: none;
        border-color: var(--accent-purple, #7b61ff);
    }

    /* Corrección específica para los checkboxes (ej. campo "Disponible") */
    .generic-form input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--accent-purple, #7b61ff);
        cursor: pointer;
    }

    .generic-form p:has(input[type="checkbox"]) {
        flex-direction: row-reverse;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
    }

    /* Manejo de errores de validación */
    .generic-form ul.errorlist {
        color: #ff4c4c;
        list-style-type: none;
        padding: 0;
        font-size: 0.8rem;
        margin: -10px 0 10px 0;
    }

    .generic-form .helptext {
        display: block;
        font-size: 0.75rem;
        color: var(--text-muted, #888888);
        margin-top: 6px;
    }

    /* Botones de acción */
    .form-actions {
        margin-top: 30px;
        display: flex;
        align-items: center;
        gap: 15px;
        border-top: 1px solid var(--border-color, #333333);
        padding-top: 20px;
    }

    .btn-submit {
        background-color: var(--accent-purple, #7b61ff);
        color: #ffffff;
        padding: 10px 24px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
        background-color: #6a50e5;
    }

    .btn-cancel {
        text-decoration: none;
        color: var(--text-muted, #888888);
        font-weight: 500;
        font-size: 0.95rem;
        transition: color 0.2s ease;
    }

    .btn-cancel:hover {
        color: var(--text-main, #eaeaea);
    }
</style>

<div class="form-box">
    <h2>{% if object %}Editar{% else %}Crear{% endif %} Registro</h2>
    <form method="post" class="generic-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn-submit">Guardar</button>
            <a href="{{ request.META.HTTP_REFERER }}" class="btn-cancel">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
