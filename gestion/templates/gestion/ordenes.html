{% extends 'gestion/base.html' %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center;">
    <h2>Órdenes</h2>
    <a href="{% url 'orden_crear' %}" style="background-color: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px;">Nueva Orden</a>
</div>
<table>
    <tr>
        <th>ID</th>
        <th>Cliente</th>
        <th>Mesa</th>
        <th>Estado</th>
        <th>Total</th>
        <th>Acciones</th>
    </tr>
    {% for orden in ordenes %}
    <tr>
        <td>{{ orden.id }}</td>
        <td>{{ orden.cliente.nombre }}</td>
        <td>{{ orden.mesa.numero_mesa }}</td>
        <td>{{ orden.estado_orden }}</td>
        <td>{{ orden.total }}</td>
        <td>
            <a href="{% url 'orden_editar' orden.id %}" style="color: #007bff; text-decoration: none; margin-right: 10px;">Editar</a>
            <a href="{% url 'orden_eliminar' orden.id %}" style="color: #dc3545; text-decoration: none;">Eliminar</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
