{% extends "gestion/base.html" %}

{% block content %}
<div class="contenedor" style="max-width: 600px; margin: 20px auto; text-align: center;">
    <h2>Confirmar Eliminación</h2>
    <p>¿Estás seguro de que deseas eliminar <strong>{{ object }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background-color: #d9534f; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Confirmar Eliminación</button>
        <a href="{{ request.META.HTTP_REFERER }}" style="margin-left: 10px; text-decoration: none; color: #666;">Cancelar</a>
    </form>
</div>
{% endblock %}
