{% extends 'gestion/base.html' %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center;">
    <h2>Mesas</h2>
    <a href="{% url 'mesa_crear' %}" style="background-color: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px;">Nueva Mesa</a>
</div>
<table>
    <tr>
        <th>ID</th>
        <th>Número</th>
        <th>Capacidad</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    {% for mesa in mesas %}
    <tr>
        <td>{{ mesa.id }}</td>
        <td>{{ mesa.numero_mesa }}</td>
        <td>{{ mesa.capacidad }}</td>
        <td>{{ mesa.estado_mesa }}</td>
        <td>
            <a href="{% url 'mesa_editar' mesa.id %}" style="color: #007bff; text-decoration: none; margin-right: 10px;">Editar</a>
            <a href="{% url 'mesa_eliminar' mesa.id %}" style="color: #dc3545; text-decoration: none;">Eliminar</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
