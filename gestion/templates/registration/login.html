{% extends "gestion/base.html" %}

{% block content %}
<div class="contenedor" style="max-width: 400px; margin: 50px auto;">
    <h2 style="text-align: center;">Iniciar Sesión</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background-color: #8B0000; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%;">Ingresar</button>
    </form>
    <p style="text-align: center; margin-top: 15px;">
        ¿No tienes una cuenta? <a href="{% url 'register' %}" style="color: #8B0000;">Regístrate aquí</a>
    </p>
</div>
{% endblock %}
