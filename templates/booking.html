{% extends "layout.html" %}

{% block title %}Reservar Cita Médica{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded shadow-md">
    <form action="{{ url_for('booking') }}" method="POST">
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="doctor_id">
                Especialista
            </label>
            <select name="doctor_id" id="doctor_id" class="shadow border rounded w-full py-2 px-3 text-gray-700 focus:outline-none focus:shadow-outline" required>
                <option value="">Seleccione un médico</option>
                {% for doctor in doctors %}
                <option value="{{ doctor.id }}">{{ doctor.user.full_name }} - {{ doctor.specialty.name }} ({{ doctor.clinic.name }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="clinic_id">
                Sede
            </label>
            <select name="clinic_id" id="clinic_id" class="shadow border rounded w-full py-2 px-3 text-gray-700 focus:outline-none focus:shadow-outline" required>
                <option value="">Seleccione una sede</option>
                {% for clinic in clinics %}
                <option value="{{ clinic.id }}">{{ clinic.name }} - {{ clinic.address }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="date">
                    Fecha
                </label>
                <input type="date" name="date" id="date" class="shadow border rounded w-full py-2 px-3 text-gray-700 focus:outline-none focus:shadow-outline" min="{{ today }}" required>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="time">
                    Hora
                </label>
                <select name="time" id="time" class="shadow border rounded w-full py-2 px-3 text-gray-700 focus:outline-none focus:shadow-outline" required>
                    <option value="08:00">08:00 AM</option>
                    <option value="08:30">08:30 AM</option>
                    <option value="09:00">09:00 AM</option>
                    <option value="09:30">09:30 AM</option>
                    <option value="10:00">10:00 AM</option>
                    <option value="10:30">10:30 AM</option>
                    <option value="11:00">11:00 AM</option>
                    <option value="11:30">11:30 AM</option>
                    <option value="14:00">02:00 PM</option>
                    <option value="14:30">02:30 PM</option>
                    <option value="15:00">03:00 PM</option>
                    <option value="15:30">03:30 PM</option>
                    <option value="16:00">04:00 PM</option>
                    <option value="16:30">04:30 PM</option>
                </select>
            </div>
        </div>

        <div class="flex items-center justify-end">
            <button class="bg-blue-700 hover:bg-blue-800 text-white font-bold py-2 px-6 rounded focus:outline-none focus:shadow-outline" type="submit">
                Confirmar Reserva
            </button>
        </div>
    </form>
</div>
{% endblock %}
